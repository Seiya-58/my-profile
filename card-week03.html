<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body class="bg-amber-50 mx-auto min-h-screen flex flex-col justify-center">
<h1 class="mx-auto text-3xl font-bold text-center text-gray-900 mb-10">バスケ選手紹介</h1>
<div class="flex flex-col md:flex-row justify-between items-center mx-20">
    <div class="bg-white border-4 border-orange-500 rounded-lg shadow p-4 flex flex-col items-center w-80 h-[400px] hover:scale-105 transition-transform duration-300">
        <img src="./img/八村塁.jpg" alt="プロフィール写真" class="w-48 h-48 object-cover rounded-full mb-4">
        <h2 class="text-lg text-orange-600 font-bold mb-2">八村塁</h2>
        <p class="text-gray-600">NBAで活躍する日本の選手</p>
        <p class="text-gray-600">強靭なフィジカルでディフェンスを突破する！</p>
    </div>
    <div class="bg-white border-4 border-orange-500 rounded-lg shadow p-4 flex flex-col items-center w-80 h-[400px] hover:scale-105 transition-transform duration-300">
        <img src="./img/河村.jpg" alt="プロフィール写真" class="w-48 h-48 object-cover rounded-full mb-4">
        <h2 class="text-lg text-orange-600 font-bold mb-2">河村勇輝</h2>
        <p class="text-gray-600">NBAの下部リーグで活躍する日本の選手</p>
        <p class="text-gray-600">小柄ながらもハッスルなプレーでチームを鼓舞する！</p>
    </div>
    <div class="bg-white border-4 border-orange-500 rounded-lg shadow p-4 flex flex-col items-center w-80 h-[400px] hover:scale-105 transition-transform duration-300">
        <img src="./img/渡邊.jpg" alt="プロフィール写真" class="w-48 h-48 object-cover rounded-full mb-4">
        <h2 class="text-lg text-orange-600 font-bold mb-2">渡邊雄太</h2>
        <p class="text-gray-600">NBAでのプレー経験もある日本の選手</p>
        <p class="text-gray-600">安定したプレーでチームを支える！</p>
    </div>
</div>
</body>
</html>
