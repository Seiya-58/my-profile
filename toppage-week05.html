<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 min-h-screen">
    <header class="bg-white shadow mb-4">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row md:justify-between md:items-center gap-6 p-6 md:p-8">
            <h1 class="text-2xl text-green-600 font-bold">みどりの和</h1>
            <nav class="flex flex-col md:flex-row gap-6 md:gap-8"> 
                <a href="#" class="text-sm text-gray-600 hover:text-green-600 hover:border-green-600 border-b-2 border-transparent">ホーム</a>
                <a href="#" class="text-sm text-gray-600 hover:text-green-600 hover:border-green-600 border-b-2 border-transparent">活動内容</a>
                <a href="#" class="text-sm text-gray-600 hover:text-green-600 hover:border-green-600 border-b-2 border-transparent">お問い合わせ</a>
            </nav> 
        </div> 
    </header>  
    <main class="max-w-4xl mx-auto p-6">   
        <section class="text-center mb-12">   
            <h2 class="text-2xl text-gray-900 font-bold mb-4"> かけがえのない地球のために。</h2> 
            <p class="text-gray-900 text-lg">私たちは美しい自然を未来へつなぐため、地域の皆さまと共に環境保護活動を行っています。</p>   
        </section>  
        <section class="mb-6 text-center mb-12">
            <h3 class="text-2xl text-gray-900 text-center font-bold mb-12">活動内容</h3>  
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">   
                <div class="bg-white text-center hover:scale-105 duration-300 transition-transform hover:shadow-xl group rounded-lg flex flex-col p-8"> 
                    <div class="text-3xl mb-4 group-hover:scale-110 transition-transform duration-300">🌳🌳</div>
                        <h4 class="text-xl text-gray-900 font-bold mb-2">植林活動</h4>
                        <p class="text-sm text-gray-900 flex-grow">月に1回、地域のハゲ山や公園に苗木を植え、緑豊かな森を育てる活動を行っています。</p>
                </div>     
                <div class="bg-white text-center hover:scale-105 duration-300 transition-transform hover:shadow-xl group rounded-lg flex flex-col p-8">    
                    <div class="text-3xl mb-4 group-hover:scale-110 transition-transform duration-300">🧹🌊🗑️</div>   
                        <h4 class="text-xl text-gray-900 font-bold mb-2">清掃活動</h4>
                        <p class="text-sm text-gray-900 flex-grow">海洋プラスチックごみを減らすため、毎月第2土曜日に砂浜のゴミ拾いを実施しています。</p>   
                </div>        
                <div class="bg-white text-center hover:scale-105 duration-300 transition-transform hover:shadow-xl group rounded-lg flex flex-col p-8">    
                    <div class="text-3xl mb-4 group-hover:scale-110 transition-transform duration-300">🏫</div>   
                        <h4 class="text-xl text-gray-900 font-bold mb-2">環境エコスクール</h4>
                        <p class="text-sm text-gray-900 flex-grow">未来を担う子どもたちへ向けて、リサイクルの大切さを伝える出前授業を行っています。</p>   
                </div>  
            </div>
        </section>
    </main>  
    <footer class="bg-gray-800 text-gray-400 text-xs md:text-sm text-center py-6 mt-auto">
        <div class="max-w-4xl mx-auto px-4">
            <p>&copy; 2026 NPO法人 みどりの和. All rights reserved.</p>
        </div>
    </footer>   
</body>
</html>
