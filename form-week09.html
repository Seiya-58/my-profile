<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="bg-white rounded-lg shadow-md p-8 w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-gray-800 text-center">ユーザー登録</h1>

        <form id="signupForm" class="space-y-4" novalidate>
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">お名前</label>
                <input type="text" id="name" required 
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" 
                    placeholder="山田 太郎">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">メールアドレス</label>
                <input type="email" id="email" required 
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" 
                    placeholder="example@mail.com">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">パスワード（8文字以上）</label>
                <input type="password" id="password" required minlength="8" 
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
            </div>

            <div class="flex items-center gap-2">
                <input type="checkbox" id="agree" class="w-4 h-4 text-blue-600 border-gray-300 rounded">
                <label for="agree" class="text-sm text-gray-700">利用規約に同意する</label>
            </div>

            <p id="message" class="text-sm font-medium min-h-[1.25rem]"></p>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition">
                登録する
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById("signupForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", (event) => {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const agree = document.getElementById("agree").checked;

            if (name === "") {
                message.textContent = "お名前を入力してください";
                message.className = "text-sm font-medium text-red-500";
                return;
            }

            if (email === "") {
                message.textContent = "メールアドレスを入力してください";
                message.className = "text-sm font-medium text-red-500";
                return;
            }

            if (password.length < 8) {
                message.textContent = "パスワードは8文字以上で入力してください";
                message.className = "text-sm font-medium text-red-500";
                return;
            }

            if (!agree) {
                message.textContent = "利用規約に同意してください";
                message.className = "text-sm font-medium text-red-500";
                return;
            }

            message.textContent = "登録完了！ようこそ、" + name + " さん！";
            message.className = "text-sm font-medium text-green-600";
        });
    </script>
</body>
</html>
